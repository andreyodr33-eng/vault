<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no">
<title id="page-title">CardVault</title>
<link rel="icon" href="icon-192.png" type="image/png">
<!-- динамический manifest -->
<link id="manifest-link" rel="manifest" href="/vault/manifest.json">
<link rel="manifest" href="/vault/manifest.json">
<meta name="theme-color" id="theme-color" content="#222222">

<style>
body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  background:
    linear-gradient(45deg, #e0e0e0 25%, transparent 25%),
    linear-gradient(-45deg, #e0e0e0 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #e0e0e0 75%),
    linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
  background-size: 40px 40px;
  background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
}

.flip-card {
  width: 320px;
  height: 180px;
  perspective: 1000px;
}

.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d; 
  -webkit-transform-style: preserve-3d;
  transition: transform 0.8s;
}

@media (hover: hover) and (pointer: fine) {
  .flip-card:hover .flip-card-inner {
    transform: rotateY(180deg);
  }
}

.flip-card-inner.flipped {
  transform: rotateY(180deg);
}

.flip-card-front, .flip-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 12px;
  padding: 15px;
  box-sizing: border-box;
  background: #222;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  border: 2px solid #888;
}

 .flip-card-front *,
 .flip-card-back * {
      margin: 0;
      padding: 0;
      line-height: 1.85;
}

.flip-card-back {
  transform: rotateY(180deg);
  text-align: left;
  position: relative;
  padding: 15px;
  display: block;
}
.flip-card-back h3 {
   position: absolute;
   top: 15px;
   left: 15px;
   margin: 0;
 }
.flip-card-back .qr-code {
   position: absolute;
   top: 50%;
   left: 50%;
   transform: translate(-50%, -50%);
   margin: 0;
 }
 .flip-card-back p {
   position: absolute;
   bottom: 15px;
   right: 15px;
   margin: 0;
 }

a {
  color: red !important;
  text-decoration: none;
  margin-top: 6px;
}

.qr-code {
  width: 100px;
  height: 100px;
  max-width: 80%;
  object-fit: contain;
  border-radius: 8px;
  margin: 10px 0;
 }
  /*Адаптация под экран телефона*/
      @media (max-width: 480px) {
      #consultation-form {
      padding: 15px;
      max-width: 90%;
    }
  }
</style>
</head>
<body>
<div class="flip-card" id="flipCard">
  <div class="flip-card-inner">
    <!-- Передняя сторона -->
    <div class="flip-card-front">
      <h3 id="front-name">Name</h3>
      <p id="front-position">Position</p>
      <p id="front-company" href="mailto:johnsmith@.com">Email</p>
      <a id="front-phone" href="tel:+000000000">📞 Phone</a>
    </div>
    <!-- Задняя сторона -->
    <div class="flip-card-back">
      <h3 id="back-bank">bank</h3>
      <a href="https://andreyodr33-eng.github.io/web-desing-ireland/" target="_blank">
      <img src="" alt="QR Code" class="qr-code" id="qr-code">
      </a>
      <p><a href="javascript:void(0)" onclick="shareCard()">📤 share</a></p>
    </div>
  </div>
</div>

<script>


document.addEventListener("DOMContentLoaded", function() {

let userKey = new URLSearchParams(window.location.search).get("user") || "andrew";
userKey = userKey.trim().replace(/\/$/, "").toLowerCase();
console.log("USER KEY:", userKey);

fetch("/vault/data/users.json")
  .then(res => res.json())
  .then(users => {
    console.log("ALL USERS:", users);

    const user = users[userKey];
    if (!user) {
      console.log("USER NOT FOUND:", userKey);
      return;
    }

    // ===== Лицевая сторона =====
    document.getElementById("front-name").textContent = user.name;
    document.getElementById("front-position").textContent = user.position;
    document.getElementById("front-company").textContent = user.company;

    const phoneLink = document.getElementById("front-phone");
    phoneLink.textContent = "📞 " + user.phone;
    phoneLink.href = "tel:" + user.phone;

    document.querySelector(".flip-card-front").style.backgroundColor = user.color || "#222";


    // ===== Обратная сторона =====
    document.getElementById("back-bank").textContent = user.bank;
    document.querySelector(".flip-card-back").style.backgroundColor = user.color || "#222";
  
   // ===== TEXT COLOR =====
const textColor = user.textColor || "#fff";

const textIds = [
  "front-name",
  "front-position",
  "front-company",
  "front-phone",
  "back-bank"
];

textIds.forEach(id => {
  const el = document.getElementById(id);
  if (el) el.style.color = textColor;
});

// ссылки (телефон)
document.querySelectorAll(".flip-card a").forEach(a => {
  a.style.color = textColor;
});

    // ===== QR код =====
    const qrImg = document.getElementById("qr-code"); 
    qrImg.src = user.qr.startsWith("icons/") ? "/vault/" + user.qr : user.qr;
    if (user.qr && user.qr.trim() !== "") {
      qrImg.src = user.qr;
      qrImg.style.display = "block";
    } else {
      qrImg.src = "icons/qr-placeholder.png"; // если нет QR
      qrImg.style.display = "block";
    }
  })
  .catch(err => console.error("Failed to load users.json:", err));

});
</script>
    
<script>
// Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/vault/service-worker.js")
    .then(() => console.log("Service Worker registered"))
    .catch(err => console.error("Service Worker registration failed:", err));
}
</script>
 <script>
document.addEventListener("DOMContentLoaded", function() {
  const cardInner = document.querySelector(".flip-card-inner");

  document.getElementById("flipCard").addEventListener("click", function(e) {
    // чтобы клик по ссылке share не переворачивал карту
    if (e.target.tagName.toLowerCase() === "a") return;

    cardInner.classList.toggle("flipped");
  });
});
</script>
 <script>
function shareCard() {
  if (navigator.share) {
    navigator.share({
      title: "My digital card",
      text: "Check out my digital business card:",
      url: window.location.href
    }).then(() => console.log("Shared successfully"))
      .catch(err => console.log("Share failed:", err));
  } else {
    alert("Sharing is not supported in this browser.");
  }
}
</script>
</body>
</html>
