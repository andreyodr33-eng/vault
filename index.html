 <!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no">
<title id="page-title">CardVault</title>

<!-- динамический manifest -->
<link id="manifest-link" rel="manifest">

<meta name="theme-color" id="theme-color" content="#222222">

<style>
body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  background:
    linear-gradient(45deg, #e0e0e0 25%, transparent 25%),
    linear-gradient(-45deg, #e0e0e0 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #e0e0e0 75%),
    linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
  background-size: 40px 40px;
  background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
}

.flip-card {
  width: 320px;
  height: 180px;
  perspective: 1000px;
}

.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d; 
  -webkit-transform-style: preserve-3d;
  transition: transform 0.8s;
}

@media (hover: hover) and (pointer: fine) {
  .flip-card:hover .flip-card-inner {
    transform: rotateY(180deg);
  }
}

.flip-card-inner.flipped {
  transform: rotateY(180deg);
}

.flip-card-front, .flip-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  -webkit-backfase-visibility: hidden;
  border-radius: 12px;
  padding: 15px;
  box-sizing: border-box;
  background: #222;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

 .flip-card-front *,
 .flip-card-back * {
      margin: 0;
      padding: 0;
      line-height: 1.85;
}

.flip-card-back {
  transform: rotateY(180deg);
  text-align: left;
  position: relative;
  padding: 15px;
  display: block;
}
.flip-card-back h3 {
   position: absolute;
   top: 15px;
   left: 15px;
   margin: 0;
 }
.flip-card-back .qr-code {
   position: absolute;
   top: 50%;
   left: 50%;
   transform: translate(-50%, -50%);
   margin: 0;
 }
 .flip-card-back p {
   position: absolute;
   bottom: 15px;
   right: 15px;
   margin: 0;
 }

a {
  color: red;
  text-decoration: none;
  margin-top: 6px;
}

.qr-code {
  width: 100px;
  height: 100px;
  max-width: 80%;
  object-fit: contain;
  border-radius: 8px;
  margin: 10px 0;
 }
  /*Адаптация под экран телефона*/
      @media (max-width: 480px) {
      #consultation-form {
      padding: 15px;
      max-width: 90%;
    }
  }
</style>
</head>
<body>
<div class="flip-card" id="flipCard">
  <div class="flip-card-inner">
    <!-- Передняя сторона -->
    <div class="flip-card-front">
      <h3 id="front-name">Name</h3>
      <p id="front-position">Position</p>
      <p id="front-company">Company</p>
      <a id="front-phone" href="tel:+000000000">📞 Phone</a>
    </div>
    <!-- Задняя сторона -->
    <div class="flip-card-back">
      <h3 id="back-name">Company</h3>
      <img src="" alt="QR Code" class="qr-code" id="qr-code">
      <p><a href="javascript:void(0)" onclick="shareCard()">📤 share</a></p>
    </div>
  </div>
</div>

<script>
// Определяем пользователя из пути URL
// Например: https://site.github.io/ivanov -> "ivanov"
const userKey = window.location.pathname.replace("/", "") || "andrew";

// Загружаем данные всех визиток
fetch("data/users.json")
  .then(res => res.json())
  .then(users => {
    const user = users[userKey];
    if (!user)  return;
    
  // Передняя сторона
    document.getElementById("front-name").textContent = user.name;
    document.getElementById("front-position").textContent = user.position;
    document.getElementById("front-company").textContent = user.company;
    const phoneLink = document.getElementById("front-phone");
    phoneLink.textContent = "📞 " + user.phone;
    phoneLink.href = "tel:" + user.phone;

    // Задняя сторона
    document.getElementById("back-name").textContent = user.company;
    document.getElementById("qr-code").src = user.qr;

    // Цвет темы
    document.getElementById("theme-color").content = user.color;
    document.body.style.background = user.color;

    // Динамический manifest
    generateManifest(user);
  });

// Создаём manifest динамически
function generateManifest(user) {
  const manifest = {
    name: user.name,
    short_name: user.name,
    start_url: "/" + userKey,
    display: "standalone",
    background_color: user.color,
    theme_color: user.color,
    icons: [
      { src: user.icon, sizes: "192x192", type: "image/png" }
    ]
  };

  const blob = new Blob([JSON.stringify(manifest)], {type: "application/json"});
  document.getElementById("manifest-link").href = URL.createObjectURL(blob);
}

// Переворот для touch-устройств
const flipCard = document.getElementById('flipCard');
const flipInner = flipCard.querySelector('.flip-card-inner');
const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (isTouchDevice) {
  flipCard.addEventListener('click', () => {
    flipInner.classList.toggle('flipped');
  });
}

// Web Share API
function shareCard() {
  if (navigator.share) {
    navigator.share({
      title: document.getElementById("front-name").textContent,
      text: "Моя цифровая визитка:",
      url: window.location.href
    });
  } else {
    alert("Функция поделиться не поддерживается этим браузером");
  }
}
</script>

<script>
// Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("https://andreyodr33-eng.github.io/vault/service-worker.js")
    .then(() => console.log("Service Worker registered"));
}
</script>
</body>
</html>
